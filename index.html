<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="description" content="Picture site"/><meta name="Author" content="William C. Henson"/><meta name="keywords" content="social, pictures"/><link rel="shortcut icon" href="favicon.ico" type="image/x-icon"/><title>Spots</title><script defer="defer" src="/se_project_spots/main.js"></script><link href="/se_project_spots/main.css" rel="stylesheet"></head><body><div class="page"><header class="header"><img src="" alt="Spot logo" class="header__logo"/></header><main class="content"><section class="profile page__section"><div class="profile__avatar-container"><img src="" alt="Bessie Coleman" class="profile__avatar"/> <button class="profile__avatar-btn"><img src="" alt="Pencil icon" class="profile__pencil-icon"/></button></div><div class="profile__column"><h1 class="profile__name">Bessie Coleman</h1><p class="profile__description">Civil Aviator</p><button type="button" class="profile__edit-button"><img src="" alt="pen-icon"/> Edit Profile</button></div><button type="button" class="profile__add-button"><img src="" alt="plus-icon"/> New Post</button></section><section class="cards page__section"><ul class="cards__list"><template id="card-template"><li class="card"><button class="card__delete-button" type="button"></button> <img class="card__image" src="#" alt=""/><div class="card__content"><h2 class="card__title"></h2><button type="button" class="card__like-button" aria-label="Like card"></button></div></li></template></ul></section></main><footer class="footer"><p class="footer__copyright">2025 &copy; copyright</p></footer><div class="modal" id="edit-profile-modal"><div class="modal__container"><button type="button" class="modal__close-btn"></button><h2 class="modal__title">Edit profile</h2><form class="modal__form" id="edit-profile-form" novalidate><label for="profile-name-input" class="modal__label">Name <input id="profile-name-input" clas
