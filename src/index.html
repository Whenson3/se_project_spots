<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Picture site" />
    <meta name="Author" content="William C. Henson" />
    <meta name="keywords" content="social, pictures" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <title>Spots</title>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <img
          src="./images/spots-images/Logo.svg"
          alt="Spot logo"
          class="header__logo"
        />
      </header>
      <main class="content">
        <section class="profile page__section">
          <img
            src="./images/spots-images/avatar.jpg"
            alt="Bessie Coleman"
            class="profile__avatar"
          />
          <div class="profile__column">
            <h1 class="profile__name">Bessie Coleman</h1>
            <p class="profile__description">Civil Aviator</p>
            <button type="button" class="profile__edit-button">
              <img src="./images/spots-images/pen-icon.svg" alt="pen-icon" />
              Edit Profile
            </button>
          </div>
          <button type="button" class="profile__add-button">
            <img src="./images/spots-images/plus-icon.svg" alt="plus-icon" />
            New Post
          </button>
        </section>
        <section class="cards page__section">
          <ul class="cards__list">
            <template id="card-template">
              <li class="card">
                <button class="card__delete-button" type="button"></button>
                <img class="card__image"
                src="#"
                alt=""/>
                <div class="card__content">
                  <h2 class="card__title"></h2>
                  <button type="button" class="card__like-button" aria-label="Like card">
                  </button>
                </div>
              </li>
            </template>
          </ul>
        </section>
      </main>
      <footer class="footer">
        <p class="footer__copyright">2025 &copy; copyright</p>
      </footer>
        <div class="modal" id="edit-profile-modal">
          <div class="modal__container">
            <button type="button" class="modal__close-btn"></button>
            <h2 class="modal__title">Edit profile</h2>
            <form class="modal__form" id="edit-profile-form" novalidate>
              <label for="profile-name-input" class="modal__label">
                Name
                <input
                  id="profile-name-input"
                  type="text"
                  class="modal__input"
                  placeholder="Type your name"
                  minlength="2"
                  maxlength="40"
                  required
                />
                <span id="profile-name-input-error" class="modal__error"></span>
              </label>
              <label for="profile-description-input" class="modal__label">
                Description
                <input
                  id="profile-description-input"
                  type="text"
                  class="modal__input"
                  placeholder="Describe yourself"
                  minlength="2"
                  maxlength="200"
                  required
                />
                <span id="profile-description-input-error" class="modal__error"></span>
              </label>
              <button type="submit" class="modal__submit-btn">Save</button>
            </form>
          </div>
        </div>
        <div class="modal" id="new-post-modal">
          <div class="modal__container">
            <button type="button" class="modal__close-btn"></button>
            <h2 class="modal__title">New post</h2>
            <form class="modal__form" id="card-form" novalidate>
              <label for="card-image-input" class="modal__label">
                Image link
                <input
                  id="card-image-input"
                  type="url"
                  class="modal__input"
                  name="description"
                  placeholder="Paste a link to the picture"
                  required
                />
                <span id="card-image-input-error" class="modal__error"></span>
              </label>
              <label for="card-caption-input" class="modal__label">
                Caption
                <input
                  id="card-caption-input"
                  type="text"
                  name="caption"
                  class="modal__input"
                  placeholder="Type your caption"
                  minlength="2"
                  maxlength="30"
                  required
                />
                <span id="card-caption-input-error" class="modal__error"></span>
              </label>
              <button type="submit" class="modal__submit-btn">Save</button>
            </form>
          </div>
        </div>

        <div class="modal modal_type-preview" id="preview-modal">
          <div class="modal__image-container">
            <button type="button" aria-label ="Close model" class="modal__close-btn modal__close-btn_type_preview"></button>
            <img src="#" alt="" class="modal__image">
            <p class="modal__caption"></p>
          </div>
        </div>
    </div>
    <script>
      export const config = {
  formSelector: ".modal__form",
  inputSelector: ".modal__input",
  submitButtonSelector: ".modal__submit-btn",
  inactiveButtonClass: "modal__submit-btn-error",
  inputErrorClass: "modal__input_type_error",
  errorClass: "modal__error"
};

const showInputError = (formEl, inputEl, errorMsg) => {
  const errorMsgEl = formEl.querySelector(`#${inputEl.id}-error`);
  if (!errorMsgEl) return;
  errorMsgEl.textContent = errorMsg;
  inputEl.classList.add(config.inputErrorClass);
};

const hideInputError = (formEl, inputEl) => {
  const errorMsgEl = formEl.querySelector(`#${inputEl.id}-error`);
  if (!errorMsgEl) return;
  errorMsgEl.textContent = "";
  inputEl.classList.remove(config.inputErrorClass);
};

const checkInputValidity = (formEl, inputEl) => {
  if (!inputEl.validity.valid) {
    showInputError(formEl, inputEl, inputEl.validationMessage);
  } else {
    hideInputError(formEl, inputEl);
  }
};

const hasInvalidInput = (inputList) => inputList.some((input) => !input.validity.valid);

const disableButton = (buttonEl, cfg) => {
  buttonEl.disabled = true;
  buttonEl.classList.add(cfg.inactiveButtonClass);
};

const toggleButtonState = (inputList, buttonEl, cfg) => {
  if (hasInvalidInput(inputList)) {
    disableButton(buttonEl, cfg);
  } else {
    buttonEl.disabled = false;
    buttonEl.classList.remove(cfg.inactiveButtonClass);
  }
};

const resetValidation = (formEl, inputList, cfg = config) => {
  inputList.forEach((input) => hideInputError(formEl, input));
  const button = formEl.querySelector(cfg.submitButtonSelector);
  if (button) toggleButtonState(Array.from(formEl.querySelectorAll(cfg.inputSelector)), button, cfg);
};

const setEventListeners = (formEl, cfg) => {
  const inputList = Array.from(formEl.querySelectorAll(cfg.inputSelector));
  const buttonElement = formEl.querySelector(cfg.submitButtonSelector);
  if (!buttonElement) return;

  toggleButtonState(inputList, buttonElement, cfg);

  inputList.forEach((inputElement) => {
    inputElement.addEventListener("input", () => {
      checkInputValidity(formEl, inputElement);
      toggleButtonState(inputList, buttonElement, cfg);
    });
  });
};

export const enableValidation = (cfg = config) => {
  const formList = document.querySelectorAll(cfg.formSelector);
  formList.forEach((formEl) => setEventListeners(formEl, cfg));
};

export { resetValidation, disableButton };
    </script>
    </body>
</html>
